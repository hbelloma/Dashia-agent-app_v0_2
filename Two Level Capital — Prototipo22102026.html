// ============================================================
// MINI GRÁFICO SVG PROPIO — reemplaza los 2 usos de recharts (que no
// tiene una forma confiable de cargarse en una página publicada) con
// SVG dibujado a mano. Sin librería externa, cero riesgo de que no
// cargue.
// ============================================================
function SimpleChart({ data, xKey, yKey, kind = "line", stroke, gridColor, textColor, fontMono, fillGradientId, height = 160 }) {
  const width = 320; // viewBox lógico; el SVG escala 100% del contenedor real
  const values = data.map((d) => d[yKey]);
  const min = Math.min(...values), max = Math.max(...values);
  const pad = (max - min) * 0.08 || 1;
  const yMin = min - pad, yMax = max + pad;
  const xStep = data.length > 1 ? width / (data.length - 1) : width;

  const points = data.map((d, i) => {
    const x = i * xStep;
    const y = height - ((d[yKey] - yMin) / (yMax - yMin)) * height;
    return [x, y];
  });
  const linePath = points.map((p, i) => `${i === 0 ? "M" : "L"}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ");
  const areaPath = `${linePath} L${points[points.length - 1][0].toFixed(1)},${height} L0,${height} Z`;

  const gridLines = [0, 0.25, 0.5, 0.75, 1].map((f) => height * f);
  const yLabels = [yMax, (yMax + yMin) / 2, yMin];

  return (
    <div style={{ position: "relative", width: "100%", height }}>
      <svg viewBox={`-42 -6 ${width + 48} ${height + 14}`} style={{ width: "100%", height: "100%", overflow: "visible" }}>
        {kind === "area" && (
          <defs>
            <linearGradient id={fillGradientId} x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stopColor={stroke} stopOpacity="0.35" />
              <stop offset="100%" stopColor={stroke} stopOpacity="0" />
            </linearGradient>
          </defs>
        )}
        {gridLines.map((gy, i) => (
          <line key={i} x1={0} y1={gy} x2={width} y2={gy} stroke={gridColor} strokeWidth="1" />
        ))}
        {yLabels.map((v, i) => (
          <text key={i} x={-8} y={height * (i / 2) + 3} textAnchor="end"
                fontFamily={fontMono} fontSize="9" fill={textColor}>
            {Math.abs(v) >= 1000 ? Math.round(v).toLocaleString() : v.toFixed(v % 1 === 0 ? 0 : 2)}
          </text>
        ))}
        {kind === "area" && <path d={areaPath} fill={`url(#${fillGradientId})`} stroke="none" />}
        <path d={linePath} fill="none" stroke={stroke} strokeWidth="2" strokeLinejoin="round" strokeLinecap="round" />
        {kind === "line" && points.map((p, i) => (
          <circle key={i} cx={p[0]} cy={p[1]} r="2.4" fill={stroke} />
        ))}
      </svg>
    </div>
  );
}

// Codificación inyectiva: dos emails distintos NUNCA dan el mismo perfil (reemplazar todo lo no
// alfanumérico por "_" hacía que a.b@x.com y a_b@x.com compartieran datos). Los caracteres que
// no son [a-z0-9] pasan a _<hex>_, y un "_" literal también se codifica, así que no hay ambigüedad.
function profileIdFromEmail(email) { return Array.from(email.toLowerCase()).map((c) => (/[a-z0-9]/.test(c) ? c : `_${c.codePointAt(0).toString(16)}_`)).join(""); }

/* ============================================================
   UI PRIMITIVES
   ============================================================ */
function Card({ children, style, onClick }) {
  return (
    <div
      onClick={onClick}
      style={{
        background: C.panel,
        border: `1px solid ${C.border}`,
        borderRadius: 16,
        padding: 16,
        ...style,
      }}
    >
      {children}
    </div>
  );
}

function Pill({ children, tone = "neutral" }) {
  const tones = {
    neutral: { bg: C.panelRaised, color: C.textDim, border: C.border },
    up: { bg: "rgba(52,199,123,0.12)", color: C.up, border: "rgba(52,199,123,0.35)" },
    down: { bg: "rgba(232,85,107,0.12)", color: C.down, border: "rgba(232,85,107,0.35)" },
    amber: { bg: "rgba(255,176,32,0.12)", color: C.warn, border: "rgba(255,176,32,0.35)" },   // tono de ADVERTENCIA/precaución
    violet: { bg: "rgba(139,124,246,0.14)", color: C.violet, border: "rgba(139,124,246,0.35)" },
  };
  const s = tones[tone];
  return (
    <span style={{
      display: "inline-flex", alignItems: "center", gap: 4,
      fontFamily: FONT_MONO, fontSize: 11, padding: "3px 8px",
      borderRadius: 999, background: s.bg, color: s.color, border: `1px solid ${s.border}`,
    }}>
      {children}
    </span>
  );
}

function Button({ children, onClick, variant = "primary", full, icon: Icon, disabled }) {
  const variants = {
    primary: { background: C.amber, color: "#1A1204", border: "none" },
    ghost: { background: "transparent", color: C.text, border: `1px solid ${C.border}` },
    violet: { background: C.violet, color: "#120E30", border: "none" },
  };
  const s = variants[variant];
  return (
    <button
      onClick={onClick}
      disabled={disabled}
      style={{
        ...s,
        width: full ? "100%" : undefined,
        display: "inline-flex", alignItems: "center", justifyContent: "center", gap: 8,
        fontFamily: FONT_UI, fontWeight: 600, fontSize: 14,
        padding: "11px 16px", borderRadius: 12, cursor: disabled ? "default" : "pointer",
        opacity: disabled ? 0.5 : 1, transition: "transform .12s ease, opacity .12s ease",
      }}
      className="dashia-btn"
    >
      {Icon && <Icon size={16} strokeWidth={2.25} />}
      {children}
    </button>
  );
}

function SectionLabel({ children }) {
  return (
    <div style={{
      fontFamily: FONT_UI, fontSize: 13, fontWeight: 600, color: C.textDim,
      marginBottom: 10, letterSpacing: 0.1,
    }}>
      {children}
    </div>
  );
}

/* Avatar real de DASHIA, con anillo animado cuando "habla" */
function AvatarOrb({ size = 88, speaking = false }) {
  return (
    <div style={{ position: "relative", width: size, height: size, flexShrink: 0 }}>
      {speaking && (
        <div style={{
          position: "absolute", inset: -6, borderRadius: "50%",
          border: `2px solid ${C.violet}`, opacity: 0.5,
          animation: "dashiaPulse 1.6s ease-out infinite",
        }} />
      )}
      <img
        src={AVATAR_IMG}

/* ============================================================
   PHANTOM — conexión real vía window.phantom.solana (no un mock)
   Nota: esto es el patrón estándar de conexión web/desktop. Solo
   funciona si la extensión de Phantom está instalada en el navegador
   donde se ve este prototipo. La app nativa iOS/Android usará el
   protocolo de deep link de Phantom en su lugar, que es distinto y
   queda pendiente de construir aparte.
   ============================================================ */
function getPhantomProvider() {
  if (typeof window === "undefined") return null;
  const provider = window?.phantom?.solana;
  return provider?.isPhantom ? provider : null;
}

function truncateAddress(addr) {
  return addr ? `${addr.slice(0, 4)}…${addr.slice(-4)}` : "";
}

function usePhantom() {
  const [available, setAvailable] = useState(false);
  const [connecting, setConnecting] = useState(false);
  const [publicKey, setPublicKey] = useState(null);
  const [error, setError] = useState(null);

  useEffect(() => {
    const provider = getPhantomProvider();
    setAvailable(!!provider);
    if (!provider) return;

    const onConnect = (pk) => { setPublicKey(pk.toString()); setError(null); };
    const onDisconnect = () => setPublicKey(null);
    provider.on?.("connect", onConnect);
    provider.on?.("disconnect", onDisconnect);

    // Reconexión silenciosa si el usuario ya autorizó este sitio antes
    provider.connect?.({ onlyIfTrusted: true })
      .then((resp) => setPublicKey(resp.publicKey.toString()))
      .catch(() => {});

    return () => {
      provider.removeListener?.("connect", onConnect);
      provider.removeListener?.("disconnect", onDisconnect);
    };
  }, []);

  async function connect() {
    const provider = getPhantomProvider();
    if (!provider) { setError("not-detected"); return; }
    setConnecting(true);
    setError(null);
    try {
      const resp = await provider.connect(); // abre el popup REAL de Phantom
      setPublicKey(resp.publicKey.toString());
    } catch (e) {
      setError(e?.message?.includes("reject") ? "rejected" : (e?.message || "error"));
    } finally {
      setConnecting(false);
    }
  }

  async function disconnect() {
    const provider = getPhantomProvider();
    try { await provider?.disconnect(); } catch (e) { /* noop */ }
    setPublicKey(null);
  }

  return { available, connecting, publicKey, error, connect, disconnect };
}

function useExchangeConnections() {
  const [connections, setConnections] = useState([]);
  const [loaded, setLoaded] = useState(false);

  useEffect(() => {
    (async () => {
      try {
        const raw = await store.get(scopedKey("exchange_connections"));
        setConnections(raw ? JSON.parse(raw) : []);
      } catch (e) {
        setConnections([]);
      } finally {
        setLoaded(true);
      }
    })();
  }, []);

  async function persist(next) {
    setConnections(next);
    try {
      await store.set(scopedKey("exchange_connections"), JSON.stringify(next));
    } catch (e) { /* si falla el guardado persistente, se queda en memoria igual */ }
  }

  async function addConnection(conn) {
    await persist([...connections.filter((c) => c.exchange !== conn.exchange), conn]);
  }

  async function removeConnection(exchange) {
    await persist(connections.filter((c) => c.exchange !== exchange));
  }

  return { connections, loaded, addConnection, removeConnection };
}

function maskKey(key) {
  return key.length > 4 ? key.slice(-4) : key;
}

     (Web Speech API) — funcionan de verdad, sin ningún servicio pago.

   Las respuestas de DASHIA en ambas experiencias SÍ son reales: se
   llama a la API de Anthropic directo desde este artifact (con
   búsqueda web habilitada para noticias de mercado), no son
   respuestas guionadas.

function useExperience() {
  const [experience, setExperienceState] = useState(null); // null | "basic" | "premium"
  const [loaded, setLoaded] = useState(false);

  useEffect(() => {
    (async () => {
      try {
        const raw = await store.get(scopedKey("dashia_experience"));
        setExperienceState(raw ? JSON.parse(raw) : null);
      } catch (e) {
        setExperienceState(null);
      } finally {
        setLoaded(true);
      }
    })();
  }, []);

  async function setExperience(value) {
    setExperienceState(value);
    try { await store.set(scopedKey("dashia_experience"), JSON.stringify(value)); }
    catch (e) { /* se queda en memoria igual */ }
  }

  return { experience, setExperience, loaded };
}

function speakText(text, lang, onStart, onEnd) {
  if (typeof window === "undefined" || !window.speechSynthesis) { onEnd?.(); return; }
  try {
    window.speechSynthesis.cancel(); // corta cualquier lectura anterior antes de empezar una nueva
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = lang === "es" ? "es-ES" : "en-US";
    utterance.rate = 1.02;
    utterance.onstart = () => onStart?.();
    utterance.onend = () => onEnd?.();
    utterance.onerror = () => onEnd?.();
    window.speechSynthesis.speak(utterance);
  } catch (e) {
    onEnd?.();
  }
}

function describeVoiceError(code, t) {
  const map = {
    "not-allowed": t.voiceErrNotAllowed,
    "service-not-allowed": t.voiceErrNotAllowed,
    "no-speech": t.voiceErrNoSpeech,
    "audio-capture": t.voiceErrAudioCapture,
    "network": t.voiceErrNetwork,
    "start-failed": t.voiceErrStartFailed,
  };
  return map[code] || t.voiceErrUnknown;
}

function useSpeechRecognition(lang, onResult) {
  const recognitionRef = useRef(null);
  const onResultRef = useRef(onResult);
  onResultRef.current = onResult; // siempre la versión más nueva, sin recrear el reconocedor

  const [listening, setListening] = useState(false);
  const [supported, setSupported] = useState(true);
  const [errorCode, setErrorCode] = useState(""); // "" | "not-allowed" | "no-speech" | "audio-capture" | "network" | "start-failed" | otro

  useEffect(() => {
    const SR = typeof window !== "undefined" && (window.SpeechRecognition || window.webkitSpeechRecognition);
    if (!SR) { setSupported(false); return; }
    const recognition = new SR();
    recognition.lang = lang === "es" ? "es-ES" : "en-US";
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;
    recognition.onresult = (e) => {
      const transcript = e.results?.[0]?.[0]?.transcript;
      if (transcript) onResultRef.current(transcript);
    };
    recognition.onend = () => setListening(false);
    recognition.onerror = (e) => {
      setListening(false);
      setErrorCode((e && e.error) || "unknown"); // antes esto se tragaba en silencio — ahora sí se ve
    };
    recognitionRef.current = recognition;
    return () => { try { recognition.stop(); } catch (e) {} };
  }, [lang]);

  async function start() {
    setErrorCode("");
    if (!recognitionRef.current) return;
    // Pedir el permiso de micrófono explícito ANTES de arrancar el
    // reconocimiento — en un iframe (como una página publicada) esto da
    // un error mucho más claro que dejar que SpeechRecognition falle solo.
    try {
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        stream.getTracks().forEach((tr) => tr.stop()); // solo confirmamos permiso, no hace falta el audio
      }
    } catch (e) {
      setErrorCode("not-allowed");
      return;
    }
    try { setListening(true); recognitionRef.current.start(); }
    catch (e) { setListening(false); setErrorCode("start-failed"); }
  }
  function stop() {
    try { recognitionRef.current?.stop(); } catch (e) {}
    setListening(false);
  }

  return { listening, supported, start, stop, errorCode };
}

function dashiaSystemPrompt(lang) {
  const idioma = lang === "es" ? "español" : "English";
  return `Sos DASHIA, la agente de trading de IA integrada en esta app. Tono cercano, directo, profesional.

Tu estrategia real: un clasificador ANN por distancia Lorentziana sobre indicadores normalizados (RSI, Stochastic, MFI, RVI, ADX, CCI, WaveTrend), con filtro de kernel de regresión (Rational Quadratic/Gaussian) y gestión de riesgo por planes.

Planes de riesgo: COOK (drawdown máx. 10%, conservador), WALK (30%), HAWK (50%), ALLIN (100%, sin límite).

}

async function askDashiaAI(history, userText, lang) {
  // Publicada: fetch a api.anthropic.com lo bloquea la CSP. El equivalente es la capacidad "sample".
  if (!window.claude || typeof window.claude.use !== "function") throw new Error("sample-no-disponible");
  const sample = await window.claude.use("sample");
  if (!sample) throw new Error("sample-no-disponible");
  const turns = [
    { role: "user", content: dashiaSystemPrompt(lang) },
    { role: "assistant", content: lang === "es" ? "Entendido, lista para ayudar." : "Got it, ready to help." },
    ...history.map((m) => ({ role: m.from === "user" ? "user" : "assistant", content: m.text })),
    { role: "user", content: userText },
  ];
  const result = await sample(turns, { cache: false });
  const text = (result && result.text ? result.text : "").trim();
  return text || "…";
}

  const exp = useExperience();

  const [thinking, setThinking] = useState(false);
  const [muted, setMuted] = useState(false);
  const [error, setError] = useState("");
  const endRef = useRef(null);

  async function sendMessage(overrideText) {
    const trimmed = (overrideText ?? input).trim();
    if (!trimmed || thinking) return;
    const history = messages;
    setMessages((m) => [...m, { from: "user", text: trimmed }]);
    setInput("");
    setError("");
    setThinking(true);
    try {
      const reply = await askDashiaAI(history, trimmed, lang);
      setMessages((m) => [...m, { from: "dashia", text: reply }]);
      setThinking(false);
      if (!muted) speakText(reply, lang, () => setSpeaking(true), () => setSpeaking(false));

      setThinking(false);
      setError(t.aiError);

/* ============================================================
   CONSTRUCTOR VISUAL DE AGENTES — compila al MISMO DSL que valida
   agent_sandbox/dsl_interpreter.py (whitelist sobre AST, sin eval/exec).
   Lo que se arma acá con clics es texto plano; la seguridad real sigue
   viviendo del lado del backend, esto solo evita tener que escribirlo
   a mano.
   ============================================================ */
const INDICATOR_DEFS = [
  { id: "rsi", labelKey: "indRsi", needsPeriod: true, kind: "number" },
  { id: "sma", labelKey: "indSma", needsPeriod: true, kind: "number" },
  { id: "ema", labelKey: "indEma", needsPeriod: true, kind: "number" },
  { id: "price", labelKey: "indPrice", needsPeriod: false, kind: "number" },
  { id: "volume", labelKey: "indVolume", needsPeriod: false, kind: "number" },
  { id: "trend", labelKey: "indTrend", needsPeriod: false, kind: "string", values: ["up", "down", "flat"] },
  { id: "position", labelKey: "indPosition", needsPeriod: false, kind: "string", values: ["none", "long", "short"] },
];

function describeCategoricalValue(indicatorId, value, lang) {
  const dict = {
    trend: { up: { es: "Alcista", en: "Up" }, down: { es: "Bajista", en: "Down" }, flat: { es: "Lateral", en: "Flat" } },
    position: { none: { es: "Sin posición", en: "No position" }, long: { es: "Long", en: "Long" }, short: { es: "Short", en: "Short" } },
  };
  return dict[indicatorId]?.[value]?.[lang] || value;
}

let __uidCounter = 0;
function uid() { return `id-${Date.now()}-${__uidCounter++}`; }

function newCondition() {
  return {
    id: uid(), leftIndicator: "rsi", leftPeriod: 14, operator: "<",
    rightMode: "number", rightNumber: 30, rightIndicator: "sma", rightPeriod: 50,
    rightCategorical: "up",
  };
}
function newRule() {
  return { id: uid(), conditions: [newCondition()], logic: "and", action: { type: "buy", size: "default" } };
}

const RULE_TEMPLATES = {
  oversold: () => [
    { id: uid(), logic: "and", action: { type: "buy", size: "default" },
      conditions: [{ id: uid(), leftIndicator: "rsi", leftPeriod: 14, operator: "<",
                     rightMode: "number", rightNumber: 30, rightIndicator: "sma", rightPeriod: 50, rightCategorical: "up" }] },
    { id: uid(), logic: "and", action: { type: "sell", size: "default" },
      conditions: [{ id: uid(), leftIndicator: "rsi", leftPeriod: 14, operator: ">",
                     rightMode: "number", rightNumber: 70, rightIndicator: "sma", rightPeriod: 50, rightCategorical: "up" }] },
  ],
};

// Compila las reglas al DSL real — misma gramática que valida dsl_interpreter.py
function operandText(indicatorId, period) {
  const def = INDICATOR_DEFS.find((d) => d.id === indicatorId);
  if (!def) return indicatorId;
  return def.needsPeriod ? `${indicatorId}(${period})` : `${indicatorId}()`;
}
function conditionText(cond) {
  const leftDef = INDICATOR_DEFS.find((d) => d.id === cond.leftIndicator);
  const left = operandText(cond.leftIndicator, cond.leftPeriod);
  let right;
  if (leftDef && leftDef.kind === "string") right = `"${cond.rightCategorical}"`;
  else if (cond.rightMode === "indicator") right = operandText(cond.rightIndicator, cond.rightPeriod);
  else right = String(cond.rightNumber);
  return `${left} ${cond.operator} ${right}`;
}
function ruleText(rule) {
  const condsText = rule.conditions.map(conditionText).join(` ${rule.logic} `);
  const action = rule.action.type === "hold" ? "hold()" : `${rule.action.type}(size=risk.${rule.action.size})`;
  return `if ${condsText}:\n    ${action}`;
}
function compileRulesToDSL(rules) {
  if (!rules.length) return "// Agrega al menos una regla para generar el código";
  return rules.map(ruleText).join("\n\n");
}

  const leftDef = INDICATOR_DEFS.find((d) => d.id === cond.leftIndicator);

  const ops = isCategorical ? ["==", "!="] : ["<", ">", "<=", ">=", "==", "!="];

          const newDef = INDICATOR_DEFS.find((d) => d.id === e.target.value);
          onChange({
            leftIndicator: e.target.value,
            rightMode: newDef.kind === "string" ? "categorical" : "number",
            rightCategorical: newDef.kind === "string" ? newDef.values[0] : cond.rightCategorical,
            operator: newDef.kind === "string" ? "==" : cond.operator,

        {ops.map((op) => <option key={op} value={op}>{op}</option>)}
      </select>

      {isCategorical ? (
        <select value={cond.rightCategorical} onChange={(e) => onChange({ rightCategorical: e.target.value })} style={miniSelectStyle}>
          {leftDef.values.map((v) => <option key={v} value={v}>{describeCategoricalValue(leftDef.id, v, lang)}</option>)}

      ) : (

            <button onClick={() => onChange({ rightMode: "indicator" })} style={microToggleStyle(cond.rightMode === "indicator")}>~</button>
          </div>
          {cond.rightMode === "number" ? (
            <input type="number" value={cond.rightNumber}
                   onChange={(e) => onChange({ rightNumber: parseFloat(e.target.value) || 0 })}
                   style={{ ...miniSelectStyle, flex: 1 }} />
          ) : (
            <>
              <select value={cond.rightIndicator} onChange={(e) => onChange({ rightIndicator: e.target.value })} style={{ ...miniSelectStyle, flex: 2 }}>
                {INDICATOR_DEFS.filter((d) => d.kind === "number").map((d) => <option key={d.id} value={d.id}>{t[d.labelKey]}</option>)}
              </select>

                <input type="number" min="1" value={cond.rightPeriod}
                       onChange={(e) => onChange({ rightPeriod: Math.max(1, parseInt(e.target.value) || 1) })}
                       style={{ ...miniSelectStyle, width: 52 }} />
              )}
            </>
          )}
        </div>
      )}
    </div>
  );
}

function RuleCard({ rule, index, total, t, lang, onUpdate, onRemove, onMove, dragHandlers }) {

    onUpdate({ ...rule, conditions: [...rule.conditions, newCondition()] });

function VisualAgentBuilder({ rules, setRules, t, lang }) {
  const [dragIndex, setDragIndex] = useState(null);
  const [overIndex, setOverIndex] = useState(null);

  function updateRule(id, updated) { setRules(rules.map((r) => (r.id === id ? updated : r))); }
  function removeRule(id) { setRules(rules.filter((r) => r.id !== id)); }
  function moveRule(index, dir) {
    const target = index + dir;
    if (target < 0 || target >= rules.length) return;
    const next = [...rules];
    [next[index], next[target]] = [next[target], next[index]];
    setRules(next);
  }
  function addRule() { setRules([...rules, newRule()]); }
  function applyTemplate(key) { setRules(RULE_TEMPLATES[key]()); }

  function handleDrop() {
    if (dragIndex === null || overIndex === null || dragIndex === overIndex) {
      setDragIndex(null); setOverIndex(null); return;
    }
    const next = [...rules];
    const [moved] = next.splice(dragIndex, 1);
    next.splice(overIndex, 0, moved);
    setRules(next);
    setDragIndex(null); setOverIndex(null);
  }

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
      {rules.length === 0 && (
        <div style={{ border: `1px dashed ${C.border}`, borderRadius: 10, padding: 16, textAlign: "center" }}>
          <div style={{ fontFamily: FONT_UI, fontSize: 12, color: C.textFaint, marginBottom: 10 }}>{t.noRulesYet}</div>
          <button onClick={() => applyTemplate("oversold")} style={ghostSmallBtn}>{t.templateOversold}</button>
        </div>
      )}

      {rules.map((rule, i) => (
        <RuleCard
          key={rule.id} rule={rule} index={i} total={rules.length} t={t} lang={lang}
          onUpdate={(updated) => updateRule(rule.id, updated)}
          onRemove={() => removeRule(rule.id)}
          onMove={(dir) => moveRule(i, dir)}
          dragHandlers={{
            isDragging: dragIndex === i,
            onDragStart: () => setDragIndex(i),
            onDragOver: (e) => { e.preventDefault(); setOverIndex(i); },
            onDrop: handleDrop,
            onDragEnd: () => { setDragIndex(null); setOverIndex(null); },
          }}
        />
      ))}

      {rules.length > 0 && (
        <div style={{ fontFamily: FONT_UI, fontSize: 10, color: C.textFaint, textAlign: "center" }}>{t.ruleOrderNote}</div>
      )}

      <Button variant="ghost" icon={Plus} full onClick={addRule}>{t.addRule}</Button>

      <div>
        <div style={{ fontFamily: FONT_UI, fontSize: 11, color: C.textDim, marginBottom: 6 }}>{t.codePreview}</div>
        <pre style={{
          background: C.panelRaised, border: `1px solid ${C.border}`, borderRadius: 10, padding: 10,
          fontFamily: FONT_MONO, fontSize: 10.5, color: C.violet, overflowX: "auto", margin: 0, whiteSpace: "pre",
        }}>
          {compileRulesToDSL(rules)}
        </pre>
      </div>
    </div>
  );
}

function genCurve(seed) {
  let v = 10000, x = seed;
  const rand = () => { x = (x * 9301 + 49297) % 233280; return x / 233280; };
  const out = [{ i: 0, equity: v }];
  for (let i = 1; i <= 40; i++) {
    v = v * (1 + (rand() - 0.46) * 0.035);
    out.push({ i, equity: Math.round(v) });
  }
  return out;
}

function BacktestScreen({ t }) {
  const [asset, setAsset] = useState("BTC");
  const [running, setRunning] = useState(false);
  const [result, setResult] = useState(null);

  function run() {
    setRunning(true);
    setResult(null);
    setTimeout(() => {
      const curve = genCurve(asset.length * 17 + 3);
      const final = curve[curve.length - 1].equity;
      const peak = Math.max(...curve.map((c) => c.equity));
      const trough = Math.min(...curve.map((c) => c.equity));
      setResult({
        curve, final,
        totalReturn: (((final / 10000) - 1) * 100).toFixed(2),
        maxDD: (((trough - peak) / peak) * 100).toFixed(2),
      });
      setRunning(false);
    }, 900);
  }

  return (
    <div style={{ padding: "4px 18px 18px", display: "flex", flexDirection: "column", gap: 16 }}>
      <Card>
        <SectionLabel>{t.backtestOn} DASHIA</SectionLabel>
        <div style={{ display: "flex", gap: 10, marginBottom: 12 }}>
          <select value={asset} onChange={(e) => setAsset(e.target.value)} style={{ ...inputStyle, flex: 1 }}>
            {["BTC", "ETH", "SOL", "LTC", "XRP", "ARB", "XAU"].map((a) => <option key={a}>{a}</option>)}
          </select>
          <select style={{ ...inputStyle, flex: 1 }} defaultValue="90d">
            <option value="30d">30d</option><option value="90d">90d</option><option value="1y">1y</option>
          </select>
        </div>
        <Button icon={Play} full onClick={run} disabled={running}>{running ? t.running : t.runBacktest}</Button>
      </Card>

      {result && (
        <>
          <Card>

function StatBox({ label, value, tone }) {

/* ============================================================
   EXPORTAR CSV — mismas columnas que stats/csv_export.py del backend
   (ver stats/README.md: acá se arma desde los datos de ejemplo del
   prototipo, no de un log real, porque no hay backend desplegado)
   ============================================================ */
function tradesToCsv(trades, lang, t) {
  const cols = [t.csvDate, t.csvAgent, t.csvVenue, t.csvSymbol, t.csvSide, t.csvQty, t.csvEntry, t.csvExit, t.csvPnl];
  const sideLabel = (side) => {
    if (lang === "en") return side === "long" ? "Long" : "Short";
    return side === "long" ? "Compra (long)" : "Venta (short)";
  };
  const escape = (v) => {
    const s = String(v);
    return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  };
  const rows = trades.map((tr) => [
    tr.date, tr.agent, tr.venue, tr.asset, sideLabel(tr.side),
    tr.qty, tr.entryPrice, tr.exitPrice, tr.pnl.toFixed(2),
  ]);
  return [cols, ...rows].map((row) => row.map(escape).join(",")).join("\r\n");
}

async function downloadCsv(filename, csvText) {
  const withBom = "\uFEFF" + csvText; // BOM para que Excel respete tildes/ñ
  try {
    if (window.claude && typeof window.claude.use === "function") {
      const downloads = await window.claude.use("downloads");
      if (downloads && typeof downloads.save === "function") {
        await downloads.save({ filename, data: withBom, mimeType: "text/csv" });
        return true;
      }
    }
  } catch (e) { /* cae al aviso */ }
  return false;
}

function StatsScreen({ t, lang }) {
  const totalPnl = TRADE_HISTORY.reduce((s, tr) => s + tr.pnl, 0);

  async function handleDownload() {

    const ok = await downloadCsv(`dashia_operaciones_${new Date().toISOString().slice(0, 10)}.csv`, csvText);
    setDownloadNote(ok ? t.downloadOk : t.downloadUnavailable);

  return (
    <div style={{ padding: "4px 18px 18px", display: "flex", flexDirection: "column", gap: 16 }}>

        <StatBox label={t.winRate} value={`${((wins / TRADE_HISTORY.length) * 100).toFixed(0)}%`} />
      </div>

      <Card>
        <SectionLabel>{t.pnlOverTime}</SectionLabel>
        <SimpleChart data={PNL_CURVE} yKey="pnl" kind="line" height={130}
                     stroke={C.violet} gridColor={C.borderSoft} textColor={C.textFaint} fontMono={FONT_MONO} />

      <div>

        <div style={{ fontFamily: FONT_UI, fontSize: 10, color: C.textFaint, textAlign: "center", marginTop: 6 }}>
          {t.csvNote}
        </div>
        {downloadNote && (
          <div style={{ fontFamily: FONT_UI, fontSize: 11, color: C.violet, textAlign: "center", marginTop: 4 }}>{downloadNote}</div>
        )}
      </div>

      <div>
        <SectionLabel>{t.historyTitle}</SectionLabel>
        <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
          {TRADE_HISTORY.slice().reverse().map((tr) => (
            <Card key={tr.id} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: 12 }}>
              <div>
                <div style={{ fontFamily: FONT_UI, fontWeight: 600, fontSize: 12.5, color: C.text }}>
                  {tr.asset} <span style={{ color: C.textFaint, fontWeight: 400 }}>· {tr.agent}</span>
                </div>
                <div style={{ fontFamily: FONT_MONO, fontSize: 10.5, color: C.textFaint, marginTop: 2 }}>{tr.date}</div>
              </div>
              <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                <Pill tone={tr.side === "long" ? "up" : "down"}>{tr.side === "long" ? t.long : t.short}</Pill>
                <span style={{
                  fontFamily: FONT_MONO, fontSize: 13, fontWeight: 600, minWidth: 58, textAlign: "right",
                  color: tr.pnl >= 0 ? C.up : C.down,
                }}>
                  {tr.pnl >= 0 ? "+" : ""}{tr.pnl.toFixed(1)}
                </span>
              </div>
            </Card>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   SESIÓN DE LA DEMO + PANTALLA DE LOGIN
   Honestidad por diseño: acá NO hay autenticación. La contraseña se
   lee del formulario pero nunca se guarda ni se valida ni se envía a
   ningún lado — no existe un servidor contra el cual verificarla.
   ============================================================ */
function useSession() {
  const [session, setSession] = useState(null);
  const [loaded, setLoaded] = useState(false);

  useEffect(() => {
    (async () => {
      const raw = await store.get("session");
      try {
        const s = raw ? JSON.parse(raw) : null;
        if (s && s.email && s.profileId) setSession(s);
      } catch (e) { /* sesión corrupta: se ignora */ }
      setLoaded(true);
    })();
  }, []);

  async function login(email) {
    const s = { email, profileId: profileIdFromEmail(email) };
    setSession(s);
    await store.set("session", JSON.stringify(s));
  }
  async function logout() {
    setSession(null);
    await store.set("session", JSON.stringify(null));
  }
  return { session, loaded, login, logout };
}

function LoginScreen({ t, lang, setLang, onLogin }) {
  const [mode, setMode] = useState("signin");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [showPw, setShowPw] = useState(false);
  const [error, setError] = useState("");

  function submit() {
    const e = email.trim().toLowerCase();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)) { setError(t.invalidEmail); return; }
    if (!password) { setError(t.passwordRequired); return; }
    if (mode === "signup" && password.length < 8) { setError(t.passwordTooShort); return; }
    setPassword("");   // la contraseña nunca sale de este formulario
    onLogin(e);
  }

  return (
    <div style={{ flex: 1, overflowY: "auto", padding: "18px 22px 24px" }}>
      <div style={{ display: "flex", justifyContent: "flex-end" }}>
        <div style={{ display: "flex", background: C.panelRaised, borderRadius: 999, border: `1px solid ${C.border}`, padding: 2 }}>
          {["es", "en"].map((l) => (
            <button key={l} onClick={() => setLang(l)} style={{
              border: "none", cursor: "pointer", padding: "3px 9px", borderRadius: 999,
              fontFamily: FONT_MONO, fontSize: 11, fontWeight: 600,
              background: lang === l ? C.amber : "transparent", color: lang === l ? "#1A1204" : C.textDim,
            }}>{l.toUpperCase()}</button>
          ))}
        </div>
      </div>

      <div style={{ display: "flex", flexDirection: "column", alignItems: "center", margin: "6px 0 18px" }}>
        <img src={TLC_LOGO} alt="Two Level Capital" style={{ width: 176, height: "auto", display: "block" }} />
        <div style={{ fontFamily: FONT_UI, fontWeight: 700, fontSize: 18, color: C.solPurple, marginTop: 8, textAlign: "center", lineHeight: 1.25 }}>{t.loginTitle}</div>
      </div>

      <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
        <button onClick={() => { setMode("signin"); setError(""); }} style={toggleStyle(mode === "signin")}>{t.signInTab}</button>
        <button onClick={() => { setMode("signup"); setError(""); }} style={toggleStyle(mode === "signup")}>{t.signUpTab}</button>
      </div>

      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        <div>
          <div style={{ fontFamily: FONT_UI, fontSize: 11, color: C.textDim, marginBottom: 4 }}>{t.emailLabel}</div>
          <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} style={inputStyle}
                 spellCheck={false} autoComplete="off" />
        </div>
        <div>
          <div style={{ fontFamily: FONT_UI, fontSize: 11, color: C.textDim, marginBottom: 4 }}>
            {t.passwordLabel}{mode === "signup" ? ` · ${t.passwordHint}` : ""}
          </div>
          <div style={{ position: "relative" }}>
            <input type={showPw ? "text" : "password"} value={password} onChange={(e) => setPassword(e.target.value)}
                   onKeyDown={(e) => e.key === "Enter" && submit()}
                   style={{ ...inputStyle, paddingRight: 36 }} autoComplete="off" />
            <button onClick={() => setShowPw((v) => !v)} style={{
              position: "absolute", right: 8, top: "50%", transform: "translateY(-50%)",
              background: "none", border: "none", color: C.textFaint, cursor: "pointer",
            }}>{showPw ? <EyeOff size={15} /> : <Eye size={15} />}</button>
          </div>
        </div>

        {error && <div style={{ fontFamily: FONT_UI, fontSize: 11.5, color: C.down }}>{error}</div>}
        <Button full onClick={submit}>{t.enterDemo}</Button>
      </div>

      <div style={{
        display: "flex", gap: 8, alignItems: "flex-start", marginTop: 16, padding: 10,
        background: "rgba(255,176,32,0.08)", border: "1px solid rgba(255,176,32,0.3)", borderRadius: 10,
      }}>
        <AlertTriangle size={14} color={C.warn} style={{ flexShrink: 0, marginTop: 1 }} />
        <span style={{ fontFamily: FONT_UI, fontSize: 10.5, color: C.textDim, lineHeight: 1.45 }}>{t.demoAuthNotice}</span>
      </div>
      <div style={{ fontFamily: FONT_UI, fontSize: 10, color: C.textFaint, lineHeight: 1.45, marginTop: 10 }}>{t.demoAuthReal}</div>
      <div style={{ fontFamily: FONT_UI, fontSize: 10, color: C.textFaint, lineHeight: 1.45, marginTop: 6 }}>{t.profileNote}</div>
    </div>
  );
}

function MainApp({ lang, setLang, t, session, onLogout }) {
  const [tab, setTab] = useState("dash");
  const exchanges = useExchangeConnections();
  const phantom = usePhantom();
  const conn = { cex: exchanges.connections.some((c) => c.verified), wallet: phantom.publicKey };
  const [agents, setAgents] = useState(AGENTS_SEED);
  const [dashiaActive, setDashiaActive] = useState(true);
  const [risk, setRisk] = useState("WALK");
  const [market, setMarket] = useState(MARKET_SEED);

  useEffect(() => {
    setAgents((prev) => prev.map((a) => a.id === "dashia" ? { ...a, active: dashiaActive } : a));
  }, [dashiaActive]);

  useEffect(() => {
    const id = setInterval(() => {
      setMarket((prev) => prev.map((m) => ({
        ...m,
        price: +(m.price * (1 + (Math.random() - 0.5) * 0.004)).toFixed(m.price < 10 ? 3 : 1),
        chg: +(m.chg + (Math.random() - 0.5) * 0.15).toFixed(2),
      })));
    }, 2400);
    return () => clearInterval(id);
  }, []);

  return (
    <>
        <TopBar t={t} lang={lang} setLang={setLang} conn={conn} />

        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "0 18px 6px" }}>
          <span style={{ fontFamily: FONT_MONO, fontSize: 10, color: C.textFaint, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", maxWidth: 220 }}>
            {t.signedInAs} {session.email}
          </span>
          <button onClick={onLogout} style={{
            display: "flex", alignItems: "center", gap: 4, background: "none", border: "none",
            color: C.textDim, cursor: "pointer", fontFamily: FONT_UI, fontSize: 10.5,
          }}><LogOut size={12} /> {t.logout}</button>
        </div>

        {(conn.cex || conn.wallet) && (
          <div style={{ display: "flex", gap: 6, padding: "0 18px 8px", flexWrap: "wrap" }}>
            {conn.cex && <Pill tone="up"><ShieldCheck size={11} />&nbsp;{t.noWithdraw}</Pill>}
            {conn.wallet && <Pill tone="violet"><Lock size={11} />&nbsp;{truncateAddress(conn.wallet)}</Pill>}
          </div>
        )}

        <div style={{ flex: 1, overflowY: "auto" }}>
          {tab === "dash" && <DashboardScreen t={t} lang={lang} conn={conn} agents={agents} market={market} phantom={phantom} exchanges={exchanges} />}
          {tab === "dashia" && <DashiaScreen t={t} lang={lang} active={dashiaActive} setActive={setDashiaActive} risk={risk} setRisk={setRisk} />}
          {tab === "agents" && <AgentsScreen t={t} lang={lang} agents={agents} setAgents={setAgents} />}
          {tab === "backtest" && <BacktestScreen t={t} />}
          {tab === "stats" && <StatsScreen t={t} lang={lang} />}
        </div>

        <TabBar t={t} tab={tab} setTab={setTab} />
    </>
  );
}

function App() {
  const [lang, setLang] = useState("es");
  const t = useMemo(() => STR[lang], [lang]);
  const auth = useSession();
  // Se fija ANTES de montar MainApp para que sus hooks lean/escriban bajo el
  // perfil correcto; key={profileId} lo remonta limpio al cambiar de cuenta.
  if (auth.session) CURRENT_PROFILE = auth.session.profileId;

  return (
    <Shell>
      {!auth.loaded ? null : auth.session ? (
        <MainApp key={auth.session.profileId} lang={lang} setLang={setLang} t={t}
                 session={auth.session} onLogout={auth.logout} />
      ) : (
        <LoginScreen t={t} lang={lang} setLang={setLang} onLogin={auth.login} />
      )}
    </Shell>
  );
}
